[project]
name = "flightlab"
version = "0.1.0"
description = "Progressive flight-control training harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyqtgraph>=0.13.7",
    "PyQt6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
flightlab = "flightlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flightlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
