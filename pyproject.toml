[project]
name = "flightlab"
version = "0.1.0"
description = "Progressive flight-control training harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Instructor tools: guide screenshots and the browser smoke test.
# After installing, run `playwright install chromium` once.
browser = ["playwright>=1.45"]

[project.scripts]
flightlab = "flightlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flightlab*"]

[tool.setuptools.package-data]
"flightlab.viz" = ["web/*.html", "web/*.css", "web/js/*.js", "web/vendor/*.mjs",
                   "web/vendor/*.css", "web/vendor/*.md", "web/vendor/licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
